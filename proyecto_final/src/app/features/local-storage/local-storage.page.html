<!--
  Objetivo del ejercicio:
  Guardar y recuperar datos sencillos con localStorage.

  Que debe implementar el estudiante:
  - Completar savePendingFilter() en el archivo .ts.
  - Mostrar el filtro recuperado en pantalla.

  Pistas:
  - Usa (input) para leer el valor del input.
  - Usa signal para reflejar cambios en modo zoneless.

  Resultado esperado:
  El nombre se mantiene al recargar el navegador despues de guardar.
-->
<section class="section">
  <h1>Local Storage</h1>

  <label>
    Nombre del estudiante
    <input
      type="text"
      [value]="studentName()"
      (input)="updateStudentName($any($event.target).value)"
    />
  </label>

  <label>
    Estado del filtro
    <select [value]="selectedStatus()" (change)="updateSelectedStatus($any($event.target).value)">
      <option value="pending">Pendiente</option>
      <option value="in_progress">En progreso</option>
      <option value="done">Terminada</option>
    </select>
  </label>

  <label>
    Prioridad del filtro
    <select
      [value]="selectedPriority()"
      (change)="updateSelectedPriority($any($event.target).value)"
    >
      <option value="low">Baja</option>
      <option value="medium">Media</option>
      <option value="high">Alta</option>
    </select>
  </label>

  <div class="actions">
    <button type="button" (click)="saveName()">Guardar nombre</button>
    <button type="button" (click)="clearName()">Limpiar</button>
    <button type="button" (click)="savePendingFilter()">Guardar filtro pendiente</button>
  </div>

  @if (studentName()) {
    <p>Nombre actual: {{ studentName() }}</p>
  } @else {
    <p>No hay nombre guardado todavia.</p>
  }

  @if (taskFilter(); as filter) {
    <p>Filtro pendiente:</p>
    prioridad {{ filter.priority }} estado {{ filter.status }}
  } @else {
    <p>No hay filtro pendiente guardado.</p>
  }
</section>
